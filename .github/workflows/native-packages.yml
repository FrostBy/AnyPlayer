name: Native packages

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON array of platform targets'
        default: '["windows-x86_64","windows-arm64","mac-x86_64","mac-arm64","linux-x86_64","linux-arm64"]'
        required: true
      runtime_release:
        description: 'Reuse unchanged native binaries from a checked release; blank prepares from upstream'
        default: ''
        required: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ fromJSON('{"windows-x86_64":"windows-2025","windows-arm64":"windows-11-arm","mac-x86_64":"macos-15-intel","mac-arm64":"macos-15","linux-x86_64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm"}')[matrix.target] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: zulu
          java-version: '25'
          architecture: ${{ endsWith(matrix.target, 'arm64') && 'aarch64' || 'x64' }}
      - name: Prepare Windows runtime
        if: runner.os == 'Windows' && inputs.runtime_release == ''
        shell: pwsh
        run: ./scripts/prepare-native.ps1 -Target '${{ matrix.target }}'
      - name: Prepare POSIX runtime
        if: runner.os != 'Windows' && inputs.runtime_release == ''
        shell: bash
        run: bash scripts/prepare-posix-native.sh '${{ matrix.target }}'
      - name: Reuse checked native runtime
        if: inputs.runtime_release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNTIME_RELEASE: ${{ inputs.runtime_release }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release download "$RUNTIME_RELEASE" --pattern "AnyPlayer-0.1.0-$TARGET.zip" --pattern SHA256SUMS.txt --dir build/runtime-reuse
          python - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          target=os.environ['TARGET']
          archive=Path('build/runtime-reuse')/f'AnyPlayer-0.1.0-{target}.zip'
          hashes=dict(line.split(None,1)[::-1] for line in (archive.parent/'SHA256SUMS.txt').read_text().splitlines())
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==hashes[archive.name]
          destination=Path('native',target,'native').resolve()
          assert not destination.exists()
          with zipfile.ZipFile(archive) as z:
              assert json.loads(z.read('AnyPlayer/native/dependencies.json'))[target]==json.loads(Path('native/dependencies.json').read_text())[target], 'Native lock differs; prepare from upstream'
              for entry in z.infolist():
                  if not entry.filename.startswith('AnyPlayer/native/') or entry.is_dir(): continue
                  p=(destination/entry.filename.removeprefix('AnyPlayer/native/')).resolve()
                  assert p.is_relative_to(destination)
                  p.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(entry) as source,p.open('wb') as output: shutil.copyfileobj(source,output)
                  if os.name!='nt': p.chmod((entry.external_attr>>16)&0o777 or 0o644)
          print('Verified and reused native binaries only:',target)
          PY
      - name: Install matching ARM64 IntelliJ SDK
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.jetbrains.com/idea/idea-2026.1-aarch64.exe'
          New-Item -ItemType Directory -Path build/ide-arm64 -Force | Out-Null
          Invoke-WebRequest $url -OutFile build/idea-arm64.exe
          $checksum = ((Invoke-WebRequest "$url.sha256").Content -split '\s+')[0]
          if ($checksum -notmatch '^[a-fA-F0-9]{64}$' -or (Get-FileHash build/idea-arm64.exe -Algorithm SHA256).Hash -ne $checksum) { throw 'IntelliJ SDK checksum mismatch' }
          & 7z x build/idea-arm64.exe '-obuild/ide-arm64' -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw 'IntelliJ SDK extraction failed' }
          $info = Get-ChildItem build/ide-arm64 -Filter product-info.json -File -Recurse | Select-Object -First 1
          if (-not $info) { throw 'IntelliJ SDK product-info.json missing' }
          "ORG_GRADLE_PROJECT_localIdePath=$($info.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build platform ZIP
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash ./gradlew --no-daemon "buildPluginVariants_${TARGET/-/_}" --console=plain
      - name: Validate and extract the installation ZIP
        shell: bash
        run: python scripts/check-native-package.py '${{ matrix.target }}'
      - name: Check IntelliJ SDK behavior and plugin API
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: ./gradlew.bat --no-daemon test verifyPlugin --console=plain
      - name: Exercise installed Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./gradlew.bat --no-daemon nativeTest "-PnativeRoot=$PWD/build/installed/AnyPlayer/native" --console=plain
      - name: Exercise installed macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./gradlew --no-daemon nativeTest "-PnativeRoot=$PWD/build/installed/AnyPlayer/native" --console=plain
      - name: Exercise installed Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a bash ./gradlew --no-daemon nativeTest "-PnativeRoot=$PWD/build/installed/AnyPlayer/native" --console=plain
      - name: Upload checked package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AnyPlayer-${{ matrix.target }}
          path: |
            build/distributions/*-${{ matrix.target }}.zip
            build/distributions/*-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/reports/tests/nativeTest/
            build/test-results/nativeTest/
            build/test-results/test/
            build/reports/tests/test/
            build/reports/pluginVerifier/
            native/${{ matrix.target }}/native/licenses/
            native/${{ matrix.target }}/native/inventory.json
          if-no-files-found: ignore
