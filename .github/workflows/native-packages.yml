name: Native packages

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON array of platform targets'
        default: '["windows-x86_64","windows-arm64","mac-x86_64","mac-arm64","linux-x86_64","linux-arm64"]'
        required: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ fromJSON('{"windows-x86_64":"windows-2025","windows-arm64":"windows-11-arm","mac-x86_64":"macos-15-intel","mac-arm64":"macos-15","linux-x86_64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm"}')[matrix.target] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: zulu
          java-version: '25'
          architecture: ${{ endsWith(matrix.target, 'arm64') && 'aarch64' || 'x64' }}
      - name: Prepare Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-native.ps1 -Target '${{ matrix.target }}'
      - name: Prepare POSIX runtime
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/prepare-posix-native.sh '${{ matrix.target }}'
      - name: Install matching ARM64 IntelliJ SDK
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.jetbrains.com/idea/idea-2026.1-aarch64.exe'
          New-Item -ItemType Directory -Path build/ide-arm64 -Force | Out-Null
          Invoke-WebRequest $url -OutFile build/idea-arm64.exe
          $checksum = ((Invoke-WebRequest "$url.sha256").Content -split '\s+')[0]
          if ($checksum -notmatch '^[a-fA-F0-9]{64}$' -or (Get-FileHash build/idea-arm64.exe -Algorithm SHA256).Hash -ne $checksum) { throw 'IntelliJ SDK checksum mismatch' }
          & 7z x build/idea-arm64.exe '-obuild/ide-arm64' -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw 'IntelliJ SDK extraction failed' }
          $info = Get-ChildItem build/ide-arm64 -Filter product-info.json -File -Recurse | Select-Object -First 1
          if (-not $info) { throw 'IntelliJ SDK product-info.json missing' }
          "ORG_GRADLE_PROJECT_localIdePath=$($info.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build platform ZIP
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash ./gradlew --no-daemon "buildPluginVariants_${TARGET/-/_}" --console=plain
      - name: Validate and extract the installation ZIP
        shell: bash
        run: python scripts/check-native-package.py '${{ matrix.target }}'
      - name: Exercise installed Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./gradlew.bat --no-daemon nativeTest "-PnativeRoot=$PWD/build/installed/AnyPlayer/native" --console=plain
      - name: Exercise installed macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./gradlew --no-daemon nativeTest "-PnativeRoot=$PWD/build/installed/AnyPlayer/native" --console=plain
      - name: Exercise installed Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a bash ./gradlew --no-daemon nativeTest "-PnativeRoot=$PWD/build/installed/AnyPlayer/native" --console=plain
      - name: Upload checked package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AnyPlayer-${{ matrix.target }}
          path: |
            build/distributions/*-${{ matrix.target }}.zip
            build/distributions/*-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/reports/tests/nativeTest/
            build/test-results/nativeTest/
            native/${{ matrix.target }}/native/licenses/
            native/${{ matrix.target }}/native/inventory.json
          if-no-files-found: ignore
